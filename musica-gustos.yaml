nota: 'Perfil de gustos del grupo, destilado de su tabla de sugerencias 2022-2024. Sin nombres: solo obras
  y promedios (0-10). Lo usa lector.py para las recomendaciones diarias.'
sintesis: 'House y deep house clasico y contemporaneo (Moodymann, Kerri Chandler, Instant House), DJ sets
  de sellos y series reales (Boiler Room, HOR, Trommel, fruitcast, KHIDI), electronica global y africana
  (Ndagga Rhythm Force), dembow y reggaeton de barrio no comercial (El Alfa, La Perversa, Kaydy Cain/La
  Zowi), rap mexicano (Tino el Pinguino), funk y soul (James Brown), pop indie con groove (Benny Sings,
  Jamie xx, Lizzo). Valoran el groove, la seleccion profunda y lo que se siente vivo. NO les gusta: reggaeton
  pop comercial y colaboraciones de playlist (Ximena Sarinana/Llane, Dimelo Flow, Duki), mashups indie
  flojos.'
